name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: beep-software/bleep-bloop-api

jobs:
  build-and-deploy:
    runs-on: [self-hosted, k3s]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG=${{ github.sha }}

          docker build -t $IMAGE:$TAG .
          docker push $IMAGE:$TAG

      - name: Create/update email secrets
        if: github.event_name == 'push'
        env:
          KUBECONFIG: /home/dobowe01/.kube/config
        run: |
          kubectl create secret generic bleep-bloop-api-email \
            -n bleep-api \
            --from-literal=GMAIL_USER="${{ secrets.GMAIL_USER }}" \
            --from-literal=GMAIL_APP_PASSWORD="${{ secrets.GMAIL_APP_PASSWORD }}" \
            --from-literal=DEFAULT_EMAIL_TO="${{ secrets.DEFAULT_EMAIL_TO }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to k3s
        if: github.event_name == 'push'
        env:
          KUBECONFIG: /home/dobowe01/.kube/config
        run: |
          kubectl set image deployment/bleep-bloop-api \
            bleep-bloop-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n bleep-api

          kubectl rollout status deployment/bleep-bloop-api \
            -n bleep-api \
            --timeout=5m